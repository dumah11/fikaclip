<title>TikTok Login Callback</title>
<style>
  :root { --bg: #faf9f6; --fg: #1c1b19; --muted: #6b6a66; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #17161a; --fg: #ece9e4; --muted: #9b9890; }
  }
  :root[data-theme="dark"] { --bg: #17161a; --fg: #ece9e4; --muted: #9b9890; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 96px 24px; text-align: center; }
  h1 { font-size: 20px; margin-bottom: 12px; }
  p { color: var(--muted); line-height: 1.6; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--muted); border-top-color: var(--fg); border-radius: 50%; margin: 0 auto 20px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<div class="wrap">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Finishing TikTok login&hellip;</h1>
  <p id="msg">Hand this back to the app running on your computer. Keep this tab open until it closes automatically.</p>
</div>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var code = params.get("code");
    var state = params.get("state");
    var error = params.get("error");
    var titleEl = document.getElementById("title");
    var msgEl = document.getElementById("msg");
    var spinnerEl = document.getElementById("spinner");

    function fail(text) {
      spinnerEl.hidden = true;
      titleEl.textContent = "Something went wrong";
      msgEl.textContent = text;
    }

    if (error) {
      fail("TikTok reported an error: " + error + ". You can close this tab and try again.");
      return;
    }
    if (!code) {
      fail("No login code was found in the URL. You can close this tab and try again.");
      return;
    }

    fetch("http://localhost:8000/receive_code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code, state: state }),
    })
      .then(function (resp) {
        if (!resp.ok) throw new Error("local app responded with " + resp.status);
        spinnerEl.hidden = true;
        titleEl.textContent = "Logged in";
        msgEl.textContent = "You can close this tab and go back to the app.";
        setTimeout(function () { window.close(); }, 1500);
      })
      .catch(function (err) {
        fail(
          "Couldn't reach the app on your computer (" + err.message + "). " +
          "Make sure it's running at localhost:8000, then copy this code manually: " + code
        );
      });
  })();
</script>
